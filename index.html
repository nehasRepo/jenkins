<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foods - Online Foodie Ordering</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #e23744;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        .welcome {
            text-align: center;
            margin-bottom: 30px;
        }

        .cards {
            display: flex;
            justify-content: space-around;
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 20px;
            width: 30%;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }

        .card h3 {
            color: #e23744;
        }

        button {
            background-color: #e23744;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            margin-top: 40px;
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🍔 Foodie</h1>
        <p>Delicious Food Delivered To Your Door</p>
    </header>

    <div class="container">

        <div class="welcome">
            <h2>Welcome to Foodie</h2>
            <p>Order your favourite food online</p>
        </div>

        <div class="cards">

            <div class="card">
                <h3>🍕 Pizza</h3>
                <p>Cheesy and delicious pizza</p>
                <h4>₹299</h4>
                <button>Order Now</button>
            </div>

            <div class="card">
                <h3>🍔 Burger</h3>
                <p>Fresh and tasty burger</p>
                <h4>₹199</h4>
                <button>Order Now</button>
            </div>

            <div class="card">
                <h3>🍝 Pasta</h3>
                <p>Italian style delicious pasta</p>
                <h4>₹249</h4>
                <button>Order Now</button>
            </div>

        </div>

    </div>

    <footer>
        <p>© 2026 Foodie | Powered by Jenkins Deployment</p>
    </footer>

</body>
</html>
